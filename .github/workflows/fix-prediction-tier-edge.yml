name: Fix prediction tier edge case

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tier slicing safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/src/server.ts')
          s = p.read_text()
          old = "function applyPredictionTier(rows: any[], tier: 'PRO' | 'TRIAL' | 'PREMIUM' | 'FREE'): any[] { const ranked = rows.map((row, index) => ({ row, quality: predictionQuality(row), index })).sort((a, b) => b.quality - a.quality || a.index - b.index); if (tier === 'PRO') return ranked.slice(0, Math.max(1, Math.ceil(ranked.length * 0.30))).map(item => item.row); if (tier === 'TRIAL') return ranked.slice(Math.ceil(ranked.length * 0.30), Math.max(Math.ceil(ranked.length * 0.70), Math.ceil(ranked.length * 0.30) + 1)).map(item => item.row); if (tier === 'PREMIUM') return ranked.slice(Math.ceil(ranked.length * 0.70)).map(item => item.row); return ranked.slice(0, Math.min(3, ranked.length)).map(item => item.row); }"
          new = "function applyPredictionTier(rows: any[], tier: 'PRO' | 'TRIAL' | 'PREMIUM' | 'FREE'): any[] { const ranked = rows.map((row, index) => ({ row, quality: predictionQuality(row), index })).sort((a, b) => b.quality - a.quality || a.index - b.index); if (!ranked.length) return []; if (ranked.length <= 3) return ranked.map(item => item.row); const n = ranked.length; const proEnd = Math.max(1, Math.ceil(n * 0.30)); const trialStart = Math.min(proEnd, n - 1); const trialEnd = Math.min(n, Math.max(trialStart + 1, Math.ceil(n * 0.70))); if (tier === 'PRO') return ranked.slice(0, proEnd).map(item => item.row); if (tier === 'TRIAL') return ranked.slice(trialStart, trialEnd).map(item => item.row); if (tier === 'PREMIUM') return ranked.slice(Math.min(trialEnd, n - 1)).map(item => item.row); return ranked.slice(0, Math.min(3, n)).map(item => item.row); }"
          if old not in s:
              raise SystemExit('Expected prediction tier function was not found; refusing an unsafe edit.')
          p.write_text(s.replace(old, new, 1))
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/server.ts
          git commit -m 'guard prediction tiers against empty result sets'
          rm -f .github/workflows/fix-prediction-tier-edge.yml
          git add .github/workflows/fix-prediction-tier-edge.yml
          git commit -m 'remove temporary tier fix workflow'
          git push