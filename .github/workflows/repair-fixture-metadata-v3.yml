name: Repair fixture metadata v3
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair fixture metadata
        run: |
          if [ ! -f .github/fixture-fix-trigger ]; then exit 0; fi
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/services/AiPredictionService.ts')
          s = p.read_text()
          s = s.replace('await this.storeFixture(fixture.raw || fixture, cycleExpiresAt);', 'await this.storeFixture(fixture, cycleExpiresAt);')
          s = s.replace('const base = this.normalizeFixture(fixture.raw || fixture);', 'const base = this.normalizeFixture(fixture);')
          old = "private normalizeFixture(item: any) { return { id: String(item.fixture?.id ?? item.id), leagueId: item.league?.id ? Number(item.league.id) : null, league: item.league?.name || item.league_name || 'Football', country: item.league?.country || item.country || '', season: item.league?.season ? Number(item.league.season) : item.season ? Number(item.season) : null, homeId: item.teams?.home?.id ? Number(item.teams.home.id) : item.home_team_id ? Number(item.home_team_id) : null, home: item.teams?.home?.name || item.home_team || item.home || 'Home', awayId: item.teams?.away?.id ? Number(item.teams.away.id) : item.away_team_id ? Number(item.away_team_id) : null, away: item.teams?.away?.name || item.away_team || item.away || 'Away', kickoff: item.fixture?.date || item.kickoff_at || new Date().toISOString(), status: String(item.fixture?.status?.short || item.status || 'NS'), homeScore: this.toNumber(item.goals?.home ?? item.home_score), awayScore: this.toNumber(item.goals?.away ?? item.away_score) }; }'
          new = '''private isPlaceholderTeam(value: unknown): boolean {
    const v = typeof value == 'string' and value.strip() or ''
    return not v or v.lower() in {'home','away','home team','away team','team home','team away','tbd','unknown','n/a','null'}
  }
'''
          # Use a TypeScript-safe replacement, constructed as plain text to avoid YAML expression parsing.
          new = '''private isPlaceholderTeam(value: unknown): boolean {
    const v = typeof value === 'string' ? value.trim().toLowerCase() : '';
    return !v || ['home','away','home team','away team','team home','team away','tbd','unknown','n/a','null'].includes(v);
  }
  private normalizeFixture(item: any) {
    const root = item || {};
    const raw = root.raw || root.raw_data || {};
    const sources = [root, raw];
    const text = (...values: any[]): string | null => {
      for (const value of values) {
        const v = typeof value === 'string' ? value.trim() : '';
        if (v && !this.isPlaceholderTeam(v)) return v;
        if (value && typeof value === 'object' && typeof value.name === 'string' && !this.isPlaceholderTeam(value.name)) return value.name.trim();
      }
      return null;
    };
    const home = text(root.teams?.home?.name, raw.teams?.home?.name, root.home_team, raw.home_team, root.homeTeam?.name, raw.homeTeam?.name, root.home_team_name, raw.home_team_name, root.home, raw.home);
    const away = text(root.teams?.away?.name, raw.teams?.away?.name, root.away_team, raw.away_team, root.awayTeam?.name, raw.awayTeam?.name, root.away_team_name, raw.away_team_name, root.away, raw.away);
    const league = text(root.league?.name, raw.league?.name, root.league_name, raw.league_name, root.leagueName, raw.leagueName, root.competition?.name, raw.competition?.name) || 'Football';
    const id = String(root.fixture?.id ?? raw.fixture?.id ?? root.id ?? raw.id ?? root.fixture_id ?? raw.fixture_id ?? '').trim();
    const kickoff = root.fixture?.date || raw.fixture?.date || root.kickoff_at || raw.kickoff_at || new Date().toISOString();
    const status = String(root.fixture?.status?.short || raw.fixture?.status?.short || root.status || raw.status || 'NS');
    return { id, leagueId: Number(root.league?.id ?? raw.league?.id ?? root.league_id ?? raw.league_id) || null, league, country: root.league?.country || raw.league?.country || root.country || raw.country || '', season: Number(root.league?.season ?? raw.league?.season ?? root.season ?? raw.season) || null, homeId: Number(root.teams?.home?.id ?? raw.teams?.home?.id ?? root.home_team_id ?? raw.home_team_id) || null, home: home || '', awayId: Number(root.teams?.away?.id ?? raw.teams?.away?.id ?? root.away_team_id ?? raw.away_team_id) || null, away: away || '', kickoff, status, homeScore: this.toNumber(root.goals?.home ?? raw.goals?.home ?? root.home_score ?? raw.home_score), awayScore: this.toNumber(root.goals?.away ?? raw.goals?.away ?? root.away_score ?? raw.away_score) };
  }'''
          if old not in s: raise SystemExit('normalize target missing')
          s = s.replace(old, new)
          old_store = 'private async storeFixture(fixture: any, cycleExpiresAt?: Date): Promise<void> {\n    const f = this.normalizeFixture(fixture);'
          new_store = 'private async storeFixture(fixture: any, cycleExpiresAt?: Date): Promise<void> {\n    const f = this.normalizeFixture(fixture);\n    if (!f.id || !f.home || !f.away) throw new Error(\'Fixture has no real team names\');'
          if old_store not in s: raise SystemExit('store target missing')
          s = s.replace(old_store, new_store)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/services/AiPredictionService.ts
          git rm .github/fixture-fix-trigger .github/workflows/repair-fixture-metadata-v3.yml
          git commit -m "fix: preserve real football team names and leagues"
          git push origin HEAD:main
