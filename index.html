<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SureBet Pro | Prediction Engine</title><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100"><div id="root"></div><script type="text/babel">const{useEffect,useState}=React;
function App(){const[matches,setMatches]=useState([]),[auto,setAuto]=useState({enabled:false,runHour:6,runMinute:0,timezone:'Africa/Kampala'}),[perf,setPerf]=useState({}),[busy,setBusy]=useState(false),[msg,setMsg]=useState('');
const load=async()=>{try{const[a,b,c]=await Promise.all([fetch('/api/predictions'),fetch('/api/automation'),fetch('/api/performance')]);setMatches((await a.json()).predictions||[]);setAuto(x=>({...x,...await b.json()}));setPerf(await c.json())}catch(e){setMsg(e.message)}};
useEffect(()=>{load();const t=setInterval(load,10000);return()=>clearInterval(t)},[]);
const toggle=async()=>{setBusy(true);try{const r=await fetch('/api/automation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...auto,enabled:!auto.enabled})});const x=await r.json();if(!r.ok)throw Error(x.error);setAuto(x);setMsg(x.enabled?'Automatic daily generation enabled.':'Automatic daily generation disabled.')}catch(e){setMsg(e.message)}finally{setBusy(false)}};
const run=async()=>{setBusy(true);try{const r=await fetch('/api/start-predictions',{method:'POST'});const x=await r.json();setMsg(x.status==='started'?`Started ${x.total} predictions.`:x.error||x.status);await load()}catch(e){setMsg(e.message)}finally{setBusy(false)}};
const badge=s=>({WIN:'bg-emerald-600',LOSE:'bg-red-600',FAILED:'bg-orange-600',PENDING:'bg-slate-600'}[s]||'bg-slate-600');
return <main className="min-h-screen p-4 md:p-8"><header className="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row gap-4 justify-between"><div><h1 className="text-3xl font-black">SureBet Pro</h1><p className="text-slate-400">Automated football prediction machine</p></div><div className="flex gap-2"><button onClick={run} disabled={busy} className="px-4 py-2 rounded-lg bg-blue-600 font-bold disabled:opacity-50">{busy?'Working…':'Run Now'}</button><button onClick={toggle} disabled={busy} className={`px-4 py-2 rounded-lg font-bold ${auto.enabled?'bg-emerald-600':'bg-slate-700'}`}>Daily Auto: {auto.enabled?'ON':'OFF'}</button></div></header>
<section className="max-w-7xl mx-auto grid md:grid-cols-4 gap-3 mb-6"><div className="p-4 rounded-xl bg-slate-900 border border-slate-800"><div className="text-slate-400 text-xs">DAILY SCHEDULE</div><div className="text-xl font-bold mt-1">{String(auto.runHour).padStart(2,'0')}:{String(auto.runMinute).padStart(2,'0')}</div><div className="text-xs text-slate-500">{auto.timezone}</div></div><div className="p-4 rounded-xl bg-slate-900 border border-slate-800"><div className="text-slate-400 text-xs">LAST RUN</div><div className="font-bold mt-1">{auto.lastRunStatus||'Not run'}</div><div className="text-xs text-slate-500">{auto.lastRunAt?new Date(auto.lastRunAt).toLocaleString():'—'}</div></div><div className="p-4 rounded-xl bg-slate-900 border border-slate-800"><div className="text-slate-400 text-xs">WINS / LOSSES</div><div className="text-xl font-bold mt-1">{perf.wins||0} / {perf.losses||0}</div></div><div className="p-4 rounded-xl bg-slate-900 border border-slate-800"><div className="text-slate-400 text-xs">ACCURACY</div><div className="text-xl font-bold mt-1">{perf.accuracy==null?'—':perf.accuracy+'%'}</div></div></section>
{msg&&<div className="max-w-7xl mx-auto mb-4 p-3 rounded-lg bg-slate-900 text-slate-300">{msg}</div>}
<section className="max-w-7xl mx-auto overflow-x-auto rounded-xl border border-slate-800"><table className="w-full text-sm"><thead className="bg-slate-900 text-slate-400"><tr>{['Match','Time','Prediction','Confidence','Models','Result','Actual Score'].map(x=><th className="p-3 text-left" key={x}>{x}</th>)}</tr></thead><tbody>{matches.map(m=><tr key={m.id} className="border-t border-slate-800"><td className="p-3 font-bold">{m.homeTeam} <span className="text-slate-500">vs</span> {m.awayTeam}<div className="text-xs text-slate-500">{m.league}</div></td><td className="p-3">{m.date}</td><td className="p-3"><span className="px-2 py-1 rounded bg-blue-600 font-bold">{m.ai?.verdict||'—'}</span><div className="text-xs mt-2 text-slate-400">Score: {m.ai?.score||'—'}</div></td><td className="p-3">{m.ai?.confidence||0}%<div className="text-xs text-slate-500">Agreement {m.ai?.agreement||0}%</div></td><td className="p-3">{m.ai?.modelCount||0}</td><td className="p-3"><span className={`px-2 py-1 rounded font-bold ${badge(m.resultStatus)}`}>{m.resultStatus}</span></td><td className="p-3 font-bold">{m.actualHomeGoals==null?'—':`${m.actualHomeGoals} - ${m.actualAwayGoals}`}</td></tr>)}</tbody></table>{!matches.length&&<div className="p-12 text-center text-slate-500">No predictions yet. Turn on Daily Auto or press Run Now.</div>}</section>
<section className="max-w-7xl mx-auto mt-6 text-xs text-slate-500">Results are settled automatically when the data provider reports the fixture as finished. A correct 1X2 prediction becomes <b>WIN</b>; an incorrect prediction becomes <b>LOSE</b>; an engine error becomes <b>FAILED</b>. Predictions are retained in persistent storage when DATABASE_URL is configured.</section></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
