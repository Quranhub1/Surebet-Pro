services:
  - type: web
    name: surebet-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: Z_AI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false

  - type: cron
    name: surebet-pro-automation
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node scripts/automation-trigger.js
    envVars:
      - key: SUREBET_PRO_URL
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
